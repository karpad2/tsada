    <div id="app"></div>
    <script>
      (function () {
        var host = location.hostname
        if (host !== 'localhost' && host !== '127.0.0.1') return
        if (!('serviceWorker' in navigator)) return
        try {
          if (sessionStorage.getItem('tsada-sw-cleared') === '1') return
        } catch (e) {}
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadSw = regs.length > 0 || !!navigator.serviceWorker.controller
          try { sessionStorage.setItem('tsada-sw-cleared', '1') } catch (e) {}
          if (!hadSw) return
          return Promise.all(regs.map(function (r) { return r.unregister() }))
            .then(function () { return caches ? caches.keys() : [] })
            .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k) })) })
            .then(function () { location.reload() })
        }).catch(function () {})
      })()
    </script>

    <!-- Error Message for Cache Issues with Countdown -->
    <div id="loadError" style="display: none; background: #ffcccb; padding: 10px; margin: 10px 0; text-align: center;">
      <p>
        It looks like the page didn't load correctly. 
        <button onclick="clearCache()">Clear Cache and Reload Now</button>
      </p>
      <p id="countdown"></p>
    </div>
    
    <script>
      let countdownInterval;
      let countdownTime = 3; // seconds before auto reload

      // Check if Vue SPA mounted (ignore static SEO prerender shells)
      window.addEventListener('load', function() {
        setTimeout(function() {
          const app = document.querySelector('#app');
          const vueMounted = app && (
            app.querySelector('[data-v-app]') ||
            app.__vue_app__ ||
            (app.children.length > 0 && !document.getElementById('seo-prerender'))
          );
          if (vueMounted || (app && app.innerHTML.trim() !== '')) return;
          const banner = document.getElementById('loadError');
          if (banner) banner.style.display = 'block';
          var host = location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          var attempts = 0;
          try { attempts = Number(sessionStorage.getItem('tsada-load-repair') || 0) } catch (e) {}
          if (isLocal || attempts >= 1) return;
          try { sessionStorage.setItem('tsada-load-repair', String(attempts + 1)) } catch (e) {}
          startCountdown();
        }, 8000);
      });

      function startCountdown() {
        const countdownElement = document.getElementById('countdown');
        countdownElement.innerText = `The page will automatically attempt to repair in ${countdownTime} seconds.`;

        countdownInterval = setInterval(() => {
          countdownTime--;
          countdownElement.innerText = `The page will automatically attempt to repair in ${countdownTime} seconds.`;

          if (countdownTime <= 0) {
            clearInterval(countdownInterval);
            clearCache(); // Auto clear cache and reload after countdown
          }
        }, 1000); // 1-second countdown interval
      }

      function clearCache() {
        clearInterval(countdownInterval); // Stop the countdown if manual clear happens
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
            window.location.reload(true); // Reloads page after clearing service worker
          });
        } else {
          window.location.reload(true); // Fallback for hard reload
        }
      }
    </script>
